<!DOCTYPE html>
<html>
<head>
  <title>Profile</title>
  <link rel="stylesheet" href="jstyle.css">
</head>

<body>

<div class="box">
  <h2>Profile</h2>

  <p id="msg">Loading...</p>

  <button onclick="logout()">Logout</button>
</div>

<script>
async function loadProfile() {

  const token = localStorage.getItem("token");

  if (!token) {
    location.href = "/jlogin.html";
    return;
  }

  const res = await fetch("/profile", {
    headers: {
      Authorization: "Bearer " + token
    }
  });

  const data = await res.json();

  if (!res.ok) {
    localStorage.removeItem("token");
    location.href = "/jlogin.html";
    return;
  }

  msg.textContent =
    "Welcome! User ID: " + data.user.id;
}

function logout() {
  localStorage.removeItem("token");
  location.href = "/jlogin.html";
}

loadProfile();
</script>

</body>
</html>
