<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link rel="stylesheet" href="jstyle.css">
</head>

<body>

  <div class="box">
    <h2>Register</h2>

    <form id="jform">

      <input
        id="jname"
        type="text"
        placeholder="Name"
        required
      >

      <input
        id="jemail"
        type="email"
        placeholder="Email"
        required
      >

      <input
        id="jpassword"
        type="password"
        placeholder="Password"
        required
      >

      <button type="submit">Register</button>

    </form>

    <p id="jmsg"></p>

    <a href="/jlogin.html">
      Already have an account? Login
    </a>
  </div>

<script>

document.getElementById("jform").addEventListener("submit", async (e) => {

  e.preventDefault();

  const jname = document.getElementById("jname").value;
  const jemail = document.getElementById("jemail").value;
  const jpassword = document.getElementById("jpassword").value;

  const res = await fetch("/register", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      name: jname,
      email: jemail,
      password: jpassword
    })

  });

  const result = await res.json();

  document.getElementById("jmsg").textContent =
    result.message || result.error;

  if (res.ok) {
    document.getElementById("jform").reset();
  }

});

</script>

</body>
</html>
