
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Update All Students</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f0c29,
                    #302b63,
                    #24243e
                );

            padding: 20px;
        }

        .container {

            width: 100%;

            max-width: 500px;
        }

        .header {

            text-align: center;

            color: white;

            margin-bottom: 25px;
        }

        .header h1 {

            font-size: 30px;

            margin-bottom: 8px;
        }

        .header p {

            color: #cbd5e1;

            font-size: 14px;
        }

        .card {

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid
                rgba(255, 255, 255, 0.20);

            border-radius: 18px;

            padding: 30px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.30);
        }

        .warning {

            background: rgba(245, 158, 11, 0.15);

            border: 1px solid
                rgba(245, 158, 11, 0.40);

            color: #fcd34d;

            padding: 14px;

            border-radius: 8px;

            margin-bottom: 22px;

            font-size: 14px;

            line-height: 1.5;
        }

        .field {

            margin-bottom: 18px;
        }

        label {

            display: block;

            color: #e2e8f0;

            font-size: 14px;

            margin-bottom: 8px;
        }

        input,
        select {

            width: 100%;

            padding: 13px 15px;

            border-radius: 9px;

            border: 1px solid
                rgba(255, 255, 255, 0.20);

            background:
                rgba(255, 255, 255, 0.08);

            color: white;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px
                rgba(139, 92, 246, 0.20);
        }

        input::placeholder {

            color: #94a3b8;
        }

        select option {

            background: #302b63;

            color: white;
        }

        .patch-btn {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #dc2626,
                    #b91c1c
                );

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        .patch-btn:hover {

            opacity: 0.9;
        }

        .patch-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }

        .message {

            display: none;

            margin-top: 20px;

            padding: 13px;

            border-radius: 8px;

            font-size: 14px;
        }

        .message.success {

            display: block;

            background:
                rgba(16, 185, 129, 0.15);

            border: 1px solid
                rgba(16, 185, 129, 0.40);

            color: #6ee7b7;
        }

        .message.error {

            display: block;

            background:
                rgba(239, 68, 68, 0.15);

            border: 1px solid
                rgba(239, 68, 68, 0.40);

            color: #fca5a5;
        }

        .links {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;
        }

        .links a {

            color: #a78bfa;

            text-decoration: none;

            margin: 0 8px;
        }

        .links a:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>Update All Students</h1>

        <p>
            Use PATCH to update all student records
        </p>

    </div>


    <div class="card">


        <div class="warning">

            <strong>Warning:</strong>

            The information entered below will be
            applied to <strong>ALL students</strong>
            in the database.

        </div>


        <form id="patchForm">


            <!-- NAME -->

            <div class="field">

                <label for="name">
                    New Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter name for all students"
                    required
                >

            </div>


            <!-- AGE -->

            <div class="field">

                <label for="age">
                    New Age
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter age for all students"
                    min="1"
                    required
                >

            </div>


            <!-- COURSE -->

            <div class="field">

                <label for="course">
                    New Course
                </label>

                <select
                    id="course"
                    required
                >

                    <option value="">
                        Select course
                    </option>

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Information Technology">
                        Information Technology
                    </option>

                    <option value="Data Science">
                        Data Science
                    </option>

                    <option value="Software Engineering">
                        Software Engineering
                    </option>

                    <option value="Cybersecurity">
                        Cybersecurity
                    </option>

                    <option value="Business Administration">
                        Business Administration
                    </option>

                    <option value="Mathematics">
                        Mathematics
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- EMAIL -->

            <div class="field">

                <label for="email">
                    New Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email for all students"
                    required
                >

            </div>


            <button
                type="submit"
                class="patch-btn"
                id="patchBtn"
            >
                Update All Students
            </button>


        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="links">

            <a href="/">
                Register
            </a>

            <a href="/update.html">
                Update One Student
            </a>

            <a href="/login.html">
                Login
            </a>

        </div>


    </div>


</div>


<script src="patch.js"></script>


</body>

</html>
