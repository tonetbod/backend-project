<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Student</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f0c29,
                    #302b63,
                    #24243e
                );

            color: white;

            padding: 30px 20px;

        }


        .container {

            width: 100%;

            max-width: 900px;

            margin: auto;

        }


        .header {

            text-align: center;

            margin-bottom: 30px;

        }


        .header h1 {

            font-size: 32px;

            margin-bottom: 8px;

        }


        .header p {

            color: #cbd5e1;

            font-size: 14px;

        }


        .card {

            background:
                rgba(255, 255, 255, 0.10);

            border:
                1px solid
                rgba(255, 255, 255, 0.20);

            border-radius: 18px;

            padding: 25px;

            margin-bottom: 20px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.30);

        }


        .card h2 {

            font-size: 19px;

            margin-bottom: 20px;

        }


        .search-row {

            display: grid;

            grid-template-columns:
                160px 1fr auto;

            gap: 10px;

        }


        select,
        input {

            width: 100%;

            padding: 12px;

            border-radius: 8px;

            border:
                1px solid
                rgba(255, 255, 255, 0.20);

            background:
                rgba(255, 255, 255, 0.08);

            color: white;

            outline: none;

            font-size: 14px;

        }


        select option {

            background: #302b63;

            color: white;

        }


        input::placeholder {

            color: #94a3b8;

        }


        select:focus,
        input:focus {

            border-color: #8b5cf6;

        }


        button {

            border: none;

            border-radius: 8px;

            padding: 12px 18px;

            color: white;

            cursor: pointer;

            font-size: 14px;

        }


        .delete-btn {

            background: #dc2626;

        }


        .delete-btn:hover {

            background: #b91c1c;

        }


        .delete-all-btn {

            width: 100%;

            background: #991b1b;

            padding: 14px;

            font-size: 15px;

        }


        .delete-all-btn:hover {

            background: #7f1d1d;

        }


        .message {

            display: none;

            padding: 13px;

            border-radius: 8px;

            margin-top: 20px;

            font-size: 14px;

        }


        .message.success {

            display: block;

            background:
                rgba(16, 185, 129, 0.15);

            border:
                1px solid
                rgba(16, 185, 129, 0.40);

            color: #6ee7b7;

        }


        .message.error {

            display: block;

            background:
                rgba(239, 68, 68, 0.15);

            border:
                1px solid
                rgba(239, 68, 68, 0.40);

            color: #fca5a5;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 20px;

            font-size: 14px;

        }


        th,
        td {

            padding: 12px 8px;

            text-align: left;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.12);

        }


        th {

            color: #c4b5fd;

        }


        td {

            color: #e2e8f0;

        }


        .empty {

            text-align: center;

            padding: 25px;

            color: #94a3b8;

        }


        .links {

            text-align: center;

            margin-top: 25px;

        }


        .links a {

            color: #a78bfa;

            text-decoration: none;

            margin: 0 10px;

            font-size: 14px;

        }


        .links a:hover {

            text-decoration: underline;

        }


        @media (max-width: 650px) {

            .search-row {

                grid-template-columns: 1fr;

            }


            table {

                font-size: 12px;

            }


            th,
            td {

                padding: 8px 5px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>Delete Student</h1>

        <p>
            Delete student records from PostgreSQL
        </p>

    </div>


    <!-- ========================================
         DELETE BY FIELD
    ========================================= -->

    <div class="card">

        <h2>
            Delete Student by Field
        </h2>


        <div class="search-row">


            <select id="deleteType">

                <option value="id">
                    Student ID
                </option>

                <option value="name">
                    Name
                </option>

                <option value="age">
                    Age
                </option>

                <option value="course">
                    Course
                </option>

                <option value="email">
                    Email
                </option>

            </select>


            <input
                type="text"
                id="deleteValue"
                placeholder="Enter value"
            >


            <button
                class="delete-btn"
                onclick="deleteByField()"
            >
                Delete
            </button>


        </div>


        <div
            id="message"
            class="message"
        ></div>


    </div>


    <!-- ========================================
         DELETE ALL
    ========================================= -->

    <div class="card">

        <h2>
            Delete All Students
        </h2>


        <p
            style="
                color:#cbd5e1;
                font-size:14px;
                margin-bottom:15px;
            "
        >
            This will permanently delete every
            student record from the database.
        </p>


        <button
            class="delete-all-btn"
            onclick="deleteAllStudents()"
        >
            Delete All Students
        </button>


    </div>


    <!-- ========================================
         STUDENT LIST
    ========================================= -->

    <div class="card">

        <h2>
            Current Student Records
        </h2>


        <button
            onclick="loadStudents()"
            style="background:#475569;"
        >
            Refresh Records
        </button>


        <div id="studentTable"></div>


    </div>


    <!-- ========================================
         LINKS
    ========================================= -->

    <div class="links">

        <a href="/">
            Register
        </a>

        <a href="/login.html">
            Login
        </a>

        <a href="/update.html">
            Update
        </a>

    </div>


</div>


<script src="delete.js"></script>


</body>

</html>
